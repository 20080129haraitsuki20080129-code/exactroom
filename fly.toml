# Fly.io 用の設定 (同梱の Dockerfile を使います)
#   fly launch --no-deploy
#   fly secrets set SECRET_KEY=... ENVIRONMENT=production TRUST_PROXY_HEADERS=true
#   fly deploy
app = "exactroom"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  TRUST_PROXY_HEADERS = "true"
  JUDGE_ISOLATION = "process"
  JUDGE_WORKERS = "1"
  DATABASE_URL = "sqlite:////data/exactroom.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# SQLite を永続化する場合は次を有効にし、先に
#   fly volumes create exactroom_data --size 1 --region nrt
# を実行してください。
[[mounts]]
  source = "exactroom_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
