<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TeX で書いた答案を SymPy で厳密に自動判定する、ログイン不要の教室用 Web アプリ">
<meta name="color-scheme" content="light dark">
<title>ExactRoom — 数式の厳密自動判定</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2f6df6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ExactRoom">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/config.js"></script>
</head>
<body>
<a class="skip-link" href="#main">本文へ移動</a>
<header class="topbar">
  <a class="brand" href="index.html">ExactRoom</a>
  <span class="spacer"></span>
  <div class="textsize" role="group" aria-label="文字サイズ">
    <span class="textsize-label" aria-hidden="true">文字</span>
    <button type="button" id="textsize-normal" aria-pressed="true" title="文字サイズ 標準">標準</button>
    <button type="button" id="textsize-large" aria-pressed="false" title="文字サイズ 大">大</button>
    <button type="button" id="textsize-xlarge" aria-pressed="false" title="文字サイズ 特大">特大</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="role-choice" role="group" aria-label="役割を選ぶ">
    <button type="button" class="role-card" id="role-solve" aria-pressed="true">
      <span class="role-title">解答する</span>
      <span class="role-sub">部屋コードと名前で参加</span>
    </button>
    <button type="button" class="role-card" id="role-host" aria-pressed="false">
      <span class="role-title">出題する</span>
      <span class="role-sub">部屋コードと秘密キーで管理</span>
    </button>
  </div>

  <section id="panel-solve">
    <div class="card">
      <h2>部屋に参加する</h2>
      <form id="join-form" autocomplete="off">
        <label for="join-code">部屋コード</label>
        <input type="text" id="join-code" class="mono" inputmode="latin" autocapitalize="characters"
               maxlength="16" placeholder="例: K7M2QD" required>
        <label for="join-name">あなたの名前</label>
        <input type="text" id="join-name" maxlength="24" placeholder="例: 山田太郎" required>
        <details>
          <summary class="small muted" style="margin-top:12px;cursor:pointer">別の端末から戻る場合 (復帰コード)</summary>
          <label for="join-recovery">復帰コード</label>
          <input type="text" id="join-recovery" class="mono" maxlength="32" placeholder="例: K7M2-QD84">
          <p class="hint">最初に参加したときに表示されたコードです。同じ名前で入り直すときに使います。</p>
        </details>
        <div class="row" style="margin-top:16px">
          <button type="submit" class="primary" id="join-submit">参加する</button>
        </div>
        <div class="error-box" id="join-error" role="alert"></div>
      </form>
    </div>
  </section>

  <section id="panel-host" hidden>
    <div class="card">
      <h2>出題者としてログイン</h2>
      <form id="host-form" autocomplete="off">
        <label for="host-code">部屋コード</label>
        <input type="text" id="host-code" class="mono" inputmode="latin" autocapitalize="characters"
               maxlength="16" placeholder="例: K7M2QD" required>
        <label for="host-secret">秘密キー</label>
        <input type="password" id="host-secret" maxlength="128" required>
        <div class="row" style="margin-top:16px">
          <button type="submit" class="primary">ログイン</button>
        </div>
        <div class="error-box" id="host-error" role="alert"></div>
      </form>
    </div>

    <div class="card">
      <h2>新しい部屋を作る</h2>
      <form id="create-form" autocomplete="off">
        <label for="create-title">部屋の名前</label>
        <input type="text" id="create-title" maxlength="120" placeholder="例: 数学II 三角関数 小テスト">
        <label for="create-code">部屋コード (空欄なら自動で決まります)</label>
        <input type="text" id="create-code" class="mono" inputmode="latin"
               autocapitalize="characters" maxlength="16" placeholder="例: 1234 / SUGAKU2">
        <p class="hint">英数字 3 文字以上。同じコードを知っている人が同じ部屋に入ります。
          短く推測しやすいコードにすると、無関係な人に入られることがあります。</p>

        <label for="create-secret">秘密キー (8 文字以上)</label>
        <input type="password" id="create-secret" minlength="8" maxlength="128" required>
        <p class="hint">出題者はこのキーで入ります。忘れると部屋を管理できなくなります。</p>
        <div id="create-token-block" hidden>
          <label for="create-token">部屋作成の合言葉 <span id="create-token-required"></span></label>
          <input type="text" id="create-token" maxlength="128"
                 autocomplete="off" placeholder="管理者から伝えられた合言葉">
          <p class="hint" id="create-token-hint"></p>
        </div>
        <div class="row" style="margin-top:16px">
          <button type="submit" class="primary">部屋を作る</button>
        </div>
        <div class="error-box" id="create-error" role="alert"></div>
        <div class="error-box" id="create-disabled" role="status"></div>
        <div class="ok-box" id="create-ok" role="status"></div>
      </form>
    </div>
  </section>
</main>


<script type="module" src="/static/js/home.js"></script>
</body>
</html>
